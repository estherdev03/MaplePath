services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    container_name: maplepath-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/home/postgres/pgdata

volumes: 
  pgdata:
