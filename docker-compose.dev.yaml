services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    container_name: maplepath-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql

volumes: 
  pgdata:
