[project]
name = "maplepath"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cohere-compass-sdk>=2.14.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.9",
    "langchain-cohere>=0.6.0",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.5",
    "pandas>=3.0.3",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "truststore>=0.10.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
